[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acl2-mcp"
version = "0.1.0"
description = "MCP server for ACL2 theorem prover"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x removed the low-level Server decorator API used by acl2-mcp
    # (Server.list_tools etc.) and renamed FastMCP, which acl2r-mcp uses,
    # so stay on the 1.x series (>=1.2.0 is needed for FastMCP).
    "mcp>=1.2.0,<2",
    "aiofiles>=23.0.0",
    "pexpect>=4.8.0",
    "tomli; python_version < '3.11'",
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[project.scripts]
acl2-mcp = "acl2_mcp.server:main"
acl2r-mcp = "acl2_mcp_server:main"

[tool.setuptools]
packages = ["acl2_mcp"]
py-modules = ["acl2_mcp_server"]

[tool.setuptools.package-data]
acl2_mcp = ["*.sh"]
